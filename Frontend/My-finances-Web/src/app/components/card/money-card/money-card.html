<div class="card-container" [ngClass]="TypeClass">

  <!-- Ícone -->
  <div class="icon-wrapper">
    <i [ngClass]="iconClass" *ngIf="iconClass"></i>
    <ng-content select="[card-icon]"></ng-content>
  </div>

  <!-- Título -->
  <p class="card-title">{{ title }}</p>

  <!-- Saldo -->
  <h2 class="card-balance">
    {{ balance }}
  </h2>
</div>
