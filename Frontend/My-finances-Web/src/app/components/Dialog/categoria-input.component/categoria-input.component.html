<div class="dialog-container">
  <!-- Cabeçalho Centralizado -->
  <div mat-dialog-title class="dialog-header">
    <h2>{{ data.titulo }}</h2>
  </div>

  <!-- Conteúdo -->
  <mat-dialog-content class="dialog-content">
    @if (data.label) {
      <label class="input-label">{{ data.label }}</label>
    }

    <!-- Campo de Entrada -->
    <div class="input-wrapper search-wrapper">
      <i class="fa-solid fa-tags input-icon"></i>
      <input type="text" placeholder="{{ data.placeholder }}" (input)="onNomeInput($event)" />
    </div>
    <h2>Atribuição</h2>
    <!-- Opções de Atribuição (Radio Buttons) -->
    <mat-radio-group name="atribuicao" [(ngModel)]="tagPayload.atribuicao" class="radio-group">
      <mat-radio-button [value]="AtribuicaoEnum.Despesa"> Despesa </mat-radio-button>

      <mat-radio-button [value]="AtribuicaoEnum.Ganho"> Ganho </mat-radio-button>
    </mat-radio-group>
  </mat-dialog-content>

  <!-- Botões de Ação -->
  <mat-dialog-actions class="dialog-actions">
    <button mat-button class="btn-cancelar" [mat-dialog-close]="undefined">
      {{ data.textoCancelar || 'Cancelar' }}
    </button>
    <button mat-flat-button class="btn-confirmar" [mat-dialog-close]="tagPayload">
      {{ data.textoConfirmar || 'Criar' }}
    </button>
  </mat-dialog-actions>
</div>
