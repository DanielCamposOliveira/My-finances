<div class="dialog-container">
  <!-- Cabeçalho com Ícone e Título -->
  <div mat-dialog-title class="dialog-header">
    <h2>{{ data.titulo }}</h2>
  </div>

  <!-- Mensagem Central -->
  <mat-dialog-content class="dialog-content">
    <p class="dialog-message">{{ data.mensagem }}</p>
  </mat-dialog-content>

  <!-- Ações / Botões -->
  <mat-dialog-actions class="dialog-actions">
    <button mat-button class="btn-cancelar" [mat-dialog-close]="false">
      {{ data.textoCancelar || 'Cancelar' }}
    </button>
    <button mat-flat-button class="btn-confirmar" [mat-dialog-close]="true" cdkFocusInitial>
      {{ data.textoConfirmar || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</div>
