<div class="cadastro-container">
  <!-- 1º Tabela: Lançamentos -->
  <app-TableParcela
    titulo="Lançamentos"
    [parcelas]="parcelasLancamentos"
    (onPagar)="pagarLancamento($event)"
    (OpenPageCadastro)="onPageCadastro()"
  >
  </app-TableParcela>

  <!-- 2º Tabela: Contas Fixas -->
  <app-TableParcela
    titulo="Contas Fixas"
    [parcelas]="parcelasContaFixa"
    (onPagar)="pagarContaFixa($event)"
    (onValor)="ValorContaFixa($event)"
  >
  </app-TableParcela>
</div>
