<div class="cadastro-container">
  <!-- 2º Tabela: Contas Fixas -->
  <app-TableContafixa
    titulo="Contas Fixas"
    [ContaFixas]="ContaFixas"
    (OpenPageCadastro)="onPageCadastroContaFixa()"
    (AlteraStatusConta)="AtualizarStatusContaFixa($event.element, $event.ativo)"
  >
    >
  </app-TableContafixa>

  <app-TabelaLancamentos
    titulo="Lancamentos"
    [Lancamentos]="Lancamentos"
    (OpenPageCadastro)="onPageCadastroLancamento()"
  >
  </app-TabelaLancamentos>
</div>
