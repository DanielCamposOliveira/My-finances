<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <!-- CABEÇALHO -->
      <div class="text-center mb-5">
        <h1 class="fw-bold">Upload de Arquivos</h1>
        <span
          *ngIf="libraryName"
          class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle rounded-pill px-3"
        >
          {{ libraryName }}
        </span>
      </div>

      <!-- MENSAGENS DE ESTADO -->
      <div
        *ngIf="statusMessage"
        class="alert border-0 shadow-sm mb-4"
        [ngClass]="statusType === 'success' ? 'alert-success' : 'alert-danger'"
        role="status"
      >
        <i
          class="bi me-2"
          [ngClass]="statusType === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle'"
        ></i>
        {{ statusMessage }}
      </div>

      <!-- CARTÃO DE UPLOAD -->
      <div class="card border-0 shadow-sm overflow-hidden">
        <div class="card bg-body-tertiary p-2 p-md-5">
          <form (ngSubmit)="iniciarUpload()">
            <!-- ZONA DE SELEÇÃO / DROPZONE -->
            <div
              class="upload-area border-dashed rounded-4 p-5 text-center mb-4 bg-body-secondary"
              [ngClass]="{ 'border-primary bg-primary-subtle': isDragOver }"
              (dragover)="onDragOver($event)"
              (dragleave)="onDragLeave($event)"
              (drop)="onDrop($event)"
              (click)="openFileDialog()"
            >
              <i class="bi bi-cloud-arrow-up-fill fs-1 text-primary mb-3 d-block"></i>
              <label class="form-label fw-bold h5 pointer-events-none">
                {{ selectedFile ? selectedFile.name : 'Arraste seu arquivo ou clique para buscar' }}
              </label>

              <input
                #fileInput
                class="form-control mt-3 d-none"
                type="file"
                accept=".pdf, .jpeg, .jpg, application/pdf, image/jpeg"
                (change)="onFileSelected($event)"
              />

              <div class="form-text mt-2 small text-muted">Formatos aceitos: PDF, JPEG</div>
            </div>

            <!-- BOTÃO DE AÇÃO -->
            <div class="row align-items-center mb-4">
              <div class="col-12 text-md-end">
                <button
                  type="submit"
                  class="btn btn-primary px-5 fw-bold shadow-sm w-100 w-md-auto"
                  [disabled]="!selectedFile || isUploading"
                >
                  {{ isUploading ? 'Enviando...' : 'Começar Upload' }}
                </button>
              </div>
            </div>

            <!-- PAINEL DE PROGRESSO -->
            <div
              *ngIf="isUploading"
              class="text-body border rounded-3 p-4 bg-body-secondary shadow-sm"
            >
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold small text-uppercase tracking-wider">{{
                  selectedFile?.name
                }}</span>
                <span class="badge bg-primary">{{ progressPercent }}%</span>
              </div>

              <div class="progress bg-secondary" style="height: 12px; border-radius: 6px">
                <div
                  class="progress-bar progress-bar-striped progress-bar-animated bg-primary shadow-sm"
                  role="progressbar"
                  [style.width.%]="progressPercent"
                ></div>
              </div>

              <div class="mt-3 row g-0 small text-secondary">
                <div class="col-6">{{ progressText }}</div>
                <div class="col-6 text-end text-primary fw-bold">Modo Paralelo (5MB/chunk)</div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- INFORMAÇÕES DE SUPORTE -->
      <div class="mt-4 row text-muted small">
        <div class="col-md-6">
          <i class="bi bi-shield-check me-2"></i>Validação de Integridade (MD5 por chunk)
        </div>
        <div class="col-md-6">
          <i class="bi bi-lightning-charge me-2"></i>Envio paralelo resiliente com auto-retry
        </div>
      </div>
    </div>
  </div>
</div>
