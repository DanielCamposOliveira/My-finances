<main class="login-container dark-theme">
  <div class="login-card">
    <div class="login-header">
      <h2>Acessar Sistema</h2>
      <p>Bem-vindo de volta! Entre com suas credenciais.</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <!-- Exibição de Erro -->
      @if (mensagemErro()) {
        <div class="error-message">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>{{ mensagemErro() }}</span>
        </div>
      }

      <!-- Campo E-mail -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="seu@email.com"
          />
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            [(ngModel)]="senha"
            name="senha"
            required
            placeholder="••••••••"
          />
        </div>
      </div>

      <!-- Botão Entrar -->
      <button type="submit" class="btn-submit" [disabled]="estaCarregando()">
        @if (estaCarregando()) {
          <i class="fa-solid fa-spinner fa-spin"></i> Entrando...
        } @else {
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        }
      </button>

      <!-- Botão Criar Conta -->

      <a routerLink="/registre" class="btn-secondary">
        <i class="fa-solid fa-user-plus"></i> Criar Conta
      </a>
    </form>
  </div>
</main>
